user www-data;
worker_processes 1;
pid /tmp/update-fpm-nginx.pid;
error_log /tmp/update-fpm-nginx-error.log warn;
events { worker_connections 128; }
http {
    access_log off;
    server {
        listen 127.0.0.1:80;
        server_name localhost;
        root /tmp/update-request-fpm-fixture/live/public;
        location = /_test/runtime {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /tmp/search-update-fpm-source/tests/update-fpm-runtime.php;
            fastcgi_pass 127.0.0.1:9000;
        }
        location / {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /tmp/update-request-fpm-fixture/live/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 60s;
        }
    }
}
