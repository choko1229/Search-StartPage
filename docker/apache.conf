ServerName localhost
<VirtualHost *:80>
    DocumentRoot /var/www/app/public
    <Directory /var/www/app>
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /var/www/app/public>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    # Do not record OAuth codes or search terms from query strings.
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" private
    CustomLog /proc/self/fd/1 private
</VirtualHost>
